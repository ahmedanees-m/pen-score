# Literature-curated cargo capacity values for the editor universe.
# Source: primary publications + systematic review of reported integration sizes.
# Values in base pairs (bp).
# Used by S_Cargo axis (script 12_compute_S_Cargo.py).
#
# Rule: use the *reported* maximum documented cargo size, not theoretical limit.
# For recombinases, use experimentally demonstrated values.

cargo_table:
  - editor_id: SpCas9
    cargo_capacity_bp: 1000
    source: "HDR-mediated insertion; practical limit ~1 kb with high efficiency"
    primary_doi: "10.1126/science.1225829"

