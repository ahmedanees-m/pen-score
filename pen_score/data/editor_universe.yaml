# Editor Universe v1.0.4
# Curated set of 30 well-characterised programmable genome editors for PEN-SCORE.
# Each entry's canonical_accession is verified against UniProt REST API.
# This file is the central anchor for all 7 score axes.
#
# Accession corrections carried from MECH-CLASS:
#   Bxb1: Q8VVR2 -> Q9B086  (Q8VVR2 is S. aureus GajA nuclease, wrong protein)
#   Tn5:  P00509 -> Q46731   (P00509 was a wrong placeholder)
#
# S_Spec data added in v1.0.3 (2026-05-13):
#   canonical_protospacer added for 16 RNA-guided editors
#   canonical_att_site_count added for 9 non-RNA-guided editors
#   (4 sentinel editors have neither - NlovFz2, enNlovFz2, MmeFz2, evoCAST)
#
# Accession corrections in v1.0.2 (accession-validation gate run 2026-05-13):
#   IscB:   A0A7C9NZR0 -> K9VH02 (A0A7C9NZR0 deleted/Redundant proteome; K9VH02 is the
#           active IS200/IS605 IscB from Oscillatoria nigro-viridis PCC 7112, Pfam PF07282)
#   MmeFz2: A0A803GVX0 -> REQUIRES_STEP7 (A0A803GVX0 UniProt 404; no Fanzor2 annotation
#           in Mercenaria mercenaria RefSeq; retrieve protein_id from Saito 2023 Nature SI)
#   IscB PDB: 7YL3 -> null (7YL3 is human IAPP structure, not IscB)
#
# Accession corrections in v1.0.1 (audit 2026-05-12):
#   Cas12f:    A0A7Z9YGD8 -> A0A482D308 (A0A7Z9YGD8 not found in UniProt)
#   SpuFz1:    Q8I6T1     -> A0A0L0H5U9 (Q8I6T1 is Plasmodium falciparum P45/48)
#   IS621:     A0A7C9VKZ0 -> A0A2X3M8B0 (A0A7C9VKZ0 is Afipia amidohydrolase)
#   evoCAST:   A0A1B0GTW7 -> REQUIRES_STEP7 (A0A1B0GTW7 is human CIROP metallopeptidase;
#              evoCAST is PseCAST-derived, not VcCAST; no reviewed UniProt entry exists)
#   CAST_VK:   A0A2N5VM63 -> A0A8M0FGU0 (A0A2N5VM63 is a rust fungus protein;
#              CAST-V-K canonical system is ShCAST from Scytonema hofmannii)
#   NlovFz2:   A0A0C4DH50 -> REQUIRES_STEP7 (A0A0C4DH50 is Nematostella vectensis protein;
#              NlovFz2 source is Naegleria lovaniensis, accession unresolved without SI)
#   phiC31:    Q9G078     -> Q9T221 (Q9G078 is H19J phage DUF551 protein)
#   SleepingBeauty: Q9ZRL9 -> NO_UNIPROT (Q9ZRL9 is Nicotiana tabacum reverse transcriptase;
#              SB100x is a lab-engineered reconstructed protein with no UniProt entry)
#   PiggyBac:  Q3LJ27     -> Q283G1  (Q3LJ27 not found in UniProt)
#   eePASSIGE: taxid 75984 -> 2902907 (75984 is Mannheimia genus, not Mycobacteriophage Bxb1)
# PDB corrections in v1.0.1:
#   Cas12f:  7SMB -> 7C7L (7SMB is a metal-DNA nanotechnology structure)
#   SpuFz1:  8R6H -> 8GKH (confirmed from Saito 2023 Nature)
#   IS621:   8U0D -> 8WT6 (8U0D is a G-quadruplex DNA structure)
#   Bxb1:    3BOO -> 9IU2 (3BOO is Botulinum neurotoxin A)
#   CAST_VK: 7M99 -> 7N3O (7M99 is ShCAST TnsC ATPase, not Cas12k itself)
#   evoCAST: 7JE2 -> null (7JE2 not in PDB; no PseCAST structure published)
# DOI corrections in v1.0.1:
#   Cas12f:     10.1038/s41587-022-01245-x -> 10.1038/s41587-021-01009-z
#   SpuFz1_V4:  10.1016/j.molcel.2025.10.015 -> 10.1016/j.molcel.2025.09.031
#   NlovFz2:    10.1038/s41589-025-02234-9   -> 10.1038/s41589-025-01902-7
#   eePASSIGE:  10.1038/s41551-024-01234-9   -> 10.1038/s41551-024-01227-1
#   Bxb1:       10.1128/JB.185.21.6361-6368.2003 -> 10.1016/s1097-2765(03)00444-1
#               (correct paper is Ghosh/Kim/Hatfull 2003 Mol Cell, not J Bacteriol)
#   PE5max:     Doman 2025 Nat Biotechnol -> Chen et al. 2021 Cell
# Taxid corrections in v1.0.1:
#   Cas12a:  568816 -> 1219310 (BV3L6 strain used for AsCas12a)
#   Bxb1:    75984  -> 2902907 (75984 is Mannheimia genus)
#   eePASSIGE/eePASSIGE_v2: same Bxb1 taxid fix

version: "1.0.7"
created: "2026-05-12"
updated: "2026-05-25"
curator: "Anees Ahmed"
n_editors: 31
n_with_protospacer: 17
n_with_att_site: 9
notes: |
  Foundational systems from GENOME-ATLAS (genome-atlas v0.6.0) + engineered variants
  from 2024-2026 literature.  5 entries flagged pre_registered_target: true
  for the section 0.4 retrospective predictions committed before any computation.
  v1.0.1: systematic accession/PDB/DOI/taxid corrections from 2026-05-12 audit.
  v1.0.4 (2026-05-21): IS622 added as post-pipeline comparator from PEN-ASSEMBLE.
    IS622 = ISCro4 (ISFinder designation D2TGM5); same protein, two names.
    First IS110-family bridge recombinase with >6% human cell insertion efficiency.
    PenScore=0.9246 (estimated; S_Immuno IS621 proxy; S_Mature estimated 3 papers).
    S_Mature uncertainty range: 0.9221-0.9296. All values below IS621 lockpoint (0.929).
  v1.0.5 (2026-05-22): walker_motif_override field added for multi-subunit CAST
    systems (evoCAST, CAST_VK, CAST_IF) and SleepingBeauty (NO_UNIPROT sentinel).
    S_Energy axis support added. genome-atlas v0.7.1 dep noted.
  v1.0.7 (2026-05-25): IS622 renamed to ISCro4 (canonical per UniProt D2TGM5 + Pelea 2026
    Science doi:10.1126/science.adz1884); aliases: [IS622] added for backward compat.
    Two new boolean fields added to all editors: intrinsic_cargo_mechanism (PEN-COMPARE
    v3.2 Gate 3: native cargo) and cell_based_evidence (TRUE_WRITER tier). Schema v1.0.7.
    Dependency pins updated: genome-atlas>=0.7.2, mech-class>=0.5.4.
  v1.0.6 (2026-05-24): Perry-2025 IS110 ortholog panel infrastructure added
    (scripts/18_score_perry2025_panel.py). Full ortholog entries pending acquisition
    of supplementary data (data/perry2025_supplementary_orthologs.csv).
    Source: Perry et al. 2026 Science doi:10.1126/science.adz0276.

