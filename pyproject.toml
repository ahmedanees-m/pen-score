[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pen-score"
description = "Multi-axis scoring framework for programmable genome editors"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Anees Ahmed Mahaboob Ali", email = "ahmedaneesm@gmail.com"}]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26",
    "click>=8.1",
    "pydantic>=2.6",
    "requests>=2.31",
    "pyyaml>=6.0.1",
    "rich>=13.7",
]

[project.optional-dependencies]
# Scoring extras
mech-class = ["mech-class>=0.5.4,<0.6.0"]  # v0.5.4: ISCro4 canonical naming (was IS622); holdout probe renamed ISCro4_pelea_2026
atlas      = ["genome-atlas>=0.7.2,<0.8.0"]  # v0.7.2: ISCro4 canonical in foundational_systems; IS622 aliases field; DATA_PROVENANCE naming section
spec       = ["pysam>=0.22", "biopython>=1.83"]
immuno     = ["mhcflurry>=2.0"]
ml         = ["lightgbm>=4.3.0", "scikit-learn>=1.4.0"]
biophysics = ["xtb-python>=22.1"]
# Development
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]
docs = ["sphinx>=7.3", "sphinx-autodoc-typehints", "furo", "myst-nb"]

[project.scripts]
pen-score = "pen_score.cli:main"

[project.urls]
Homepage      = "https://github.com/ahmedanees-m/pen-score"
Documentation = "https://ahmedanees-m.github.io/pen-score/"
Repository    = "https://github.com/ahmedanees-m/pen-score"
Changelog     = "https://github.com/ahmedanees-m/pen-score/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/ahmedanees-m/pen-score/issues"

[tool.setuptools.packages.find]
include = ["pen_score*"]

[tool.setuptools_scm]
write_to = "pen_score/_version.py"
fallback_version = "0.1.3"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py310"
exclude = [
    "scripts/",
    "docs/",
    "containers/",
    "dist/",
    ".git/",
    "pen_score/_version.py",   # generated by setuptools-scm; single-quote strings
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "N803",   # uppercase in ML/bioinformatics convention
    "N806",   # uppercase variable in function
    "B007",   # unused loop variable
    "SIM108", # ternary operator (clarity > brevity in scientific code)
    "SIM117", # nested with statements - intentional in tests for clarity
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version        = "3.10"
strict                = false
ignore_missing_imports = true
plugins               = ["pydantic.mypy"]
exclude               = ["scripts/", "docs/", "containers/"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion   = "8.0"
addopts      = "-ra --strict-markers"
testpaths    = ["tests"]
